structure:
  expectedSections:
    - { name: SiteHeader }
    - { name: Hero }
    - { name: CardGrid }
    - { name: SiteFooter }
  expectedRegions: [SiteHeader, MainContent, CardGrid, SiteFooter]
  expectedComponents:
    SectionCard: { count: 4 }
    TextLink: { count: 5 }
    Button: { count: 2 }
