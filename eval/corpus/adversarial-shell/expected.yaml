bucket: hostile
palette:
  background: "#ffffff"
  surface: "#f2f4f7"
  text: "#12141c"
  primary: "#6d28d9"
  border: "#d8dce3"
  muted: "#6b7280"
typography:
  bodyFamily: "Sora"
  scale:
    h1: 44
    h2: 28
    h3: 22
    body: 16
